name: Build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm version 1.0.${{ github.run_number }} --no-git-tag-version
      - run: npm install
      - name: Icon erzeugen
        continue-on-error: true
        run: |
          npm install --no-save sharp png-to-ico@2.1.8
          node build/make-icon.js
      - name: Offline-3D-Heizraum bauen
        run: npm run build:3d
      - run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm version 1.0.${{ github.run_number }} --no-git-tag-version
      - run: npm install
      - name: Icon erzeugen
        continue-on-error: true
        run: |
          npm install --no-save sharp png-to-ico@2.1.8
          node build/make-icon.js
      - name: Babylon-Simulationen bauen
        run: npm run build:3d
      - name: Chromium installieren
        run: npx playwright install chromium
      - name: Echten Referenzablauf pruefen
        run: npm run test:reference
      - name: Echte Renderer-Screenshots sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reference-room-${{ github.run_number }}
          path: build/reference-screenshots/
          if-no-files-found: warn
      - run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

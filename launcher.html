<!DOCTYPE html><html lang='de'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Lernbubbles Launcher</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{color:#fff;font-family:Segoe UI,-apple-system,sans-serif;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 12% 15%,#ff6a00 0,transparent 36%),radial-gradient(circle at 90% 10%,#00d4ff 0,transparent 40%),radial-gradient(circle at 75% 95%,#9b5cff 0,transparent 42%),#080d1c}.glass{background:rgba(255,255,255,.12);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border:1px solid rgba(255,255,255,.32);box-shadow:0 14px 40px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.55)}#intro{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5;cursor:pointer;transition:opacity .8s}#intro.out{opacity:0;pointer-events:none}#intro h2{font-size:1.4rem;font-weight:400;margin:0;opacity:0;animation:up 1s .2s forwards}#intro h1{font-size:3.4rem;margin:8px 0 0;opacity:0;animation:up 1.2s .7s forwards;text-align:center;padding:0 20px}#intro small{margin-top:26px;opacity:0;animation:up 1s 1.8s forwards;font-size:.85rem;color:#cbd5e1}@keyframes up{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}#ui{width:min(520px,92vw);padding:36px 32px;border-radius:34px;text-align:center;opacity:0;transform:scale(.95);transition:opacity .7s,transform .7s}#ui.on{opacity:1;transform:none}.logo{font-size:3.6rem;filter:drop-shadow(0 0 18px rgba(255,140,0,.8))}#ui h3{margin:6px 0 0;font-size:1.7rem}#ver{opacity:.7;font-size:.85rem;margin:2px 0 18px}#st{min-height:2.6em;margin:12px 0;line-height:1.35}.pr{height:8px;border-radius:99px;background:rgba(0,0,0,.35);overflow:hidden;margin:6px 0 20px}.pr i{display:block;height:100%;width:0;background:linear-gradient(90deg,#34d399,#7dd3fc);transition:width .4s}.pr.run i{width:40%;animation:run 1.2s ease-in-out infinite}@keyframes run{0%{margin-left:-40%}100%{margin-left:100%}}.pr.done i{width:100%}.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}button{cursor:pointer;color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:99px;padding:12px 24px;font:inherit;font-weight:700;font-size:1rem;background:linear-gradient(180deg,rgba(255,255,255,.3),rgba(255,255,255,.07));box-shadow:inset 0 1px 0 rgba(255,255,255,.55);transition:.18s}button:hover:not(:disabled){transform:translateY(-2px)}button:disabled{opacity:.45;cursor:default}#go{background:linear-gradient(180deg,#34d399,#0ea5a3);border-color:#a7f3d0;padding:12px 36px;font-size:1.15rem}#ins{background:linear-gradient(180deg,#fbbf24,#f97316);border-color:#fde68a;display:none}.lnk{margin-top:18px;font-size:.8rem;opacity:.65;cursor:pointer;background:none;border:0;box-shadow:none;padding:4px;font-weight:400}.lnk:hover{opacity:1}#nin{display:none;background:rgba(0,0,0,.3);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:99px;padding:6px 12px;font:inherit}@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important;transition:none!important}}</style></head><body><div id='intro'><h2>Willkommen,</h2><h1 id='nm'>&nbsp;</h1><small>Klicken zum Überspringen</small></div><div id='ui' class='glass'><div class='logo'>🔥</div><h3>Lernbubbles</h3><div id='ver'>&nbsp;</div><div class='pr' id='pr'><i></i></div><div id='st'>Bereit</div><div class='row'><button id='chk'>↻ Update prüfen</button><button id='go' disabled>▶ Start</button></div><div class='row' style='margin-top:12px'><button id='ins'>⬆ Programm-Update installieren und neu starten</button></div><button class='lnk' id='chg'>Name ändern</button><input id='nin' maxlength='24' placeholder='Dein Name, Enter zum Speichern'></div><script>(function(){const $=id=>document.getElementById(id);if(!window.lb)window.lb={info:async()=>({user:'janik',version:'Browser-Test'}),check:async()=>{await new Promise(r=>setTimeout(r,600));return {state:'ok'}},start:()=>{location.href='app/index.html'},install:()=>{},launcher:()=>{},onStatus:()=>{}};let shown=false,name='';const cap=s=>s?s.charAt(0).toUpperCase()+s.slice(1):'Lerner';function showUi(){if(shown)return;shown=true;$('intro').classList.add('out');$('ui').classList.add('on');check()}async function check(){const st=$('st'),pr=$('pr');$('chk').disabled=true;$('go').disabled=true;pr.className='pr run';st.textContent='Prüfe auf Updates …';let r;try{r=await lb.check()}catch(e){r={state:'error',msg:String(e&&e.message||e)}}pr.className='pr done';const t={ok:'✓ Alles aktuell. Du hast die neueste Version.',updated:'✓ Neue Lerninhalte geladen. Sie sind beim Start aktiv.',appupdate:'✓ Programm-Update geladen. Neustart installiert es.',offline:'Kein Internet. Du startest mit der gespeicherten Version.',error:'Update nicht möglich: '+(r.msg||'Fehler')+'. Du startest mit der gespeicherten Version.',busy:'Prüfung läuft schon …'};st.textContent=(t[r.state]||'Fertig.')+(r.msg&&r.state!=='error'?' ('+r.msg+')':'');if(r.state==='appupdate')$('ins').style.display='inline-block';$('chk').disabled=false;$('go').disabled=false}lb.onStatus(t=>{$('st').textContent=t});$('chk').onclick=check;$('go').onclick=()=>lb.start();$('ins').onclick=()=>lb.install();$('intro').onclick=showUi;document.onkeydown=e=>{if(!shown&&(e.key==='Enter'||e.key===' '||e.key==='Escape'))showUi();else if(shown&&e.key==='Enter'&&document.activeElement!==$('nin')&&!$('go').disabled)lb.start()};$('chg').onclick=()=>{$('nin').style.display='inline-block';$('nin').value=name;$('nin').focus()};$('nin').onkeydown=e=>{e.stopPropagation();if(e.key==='Enter'){const v=$('nin').value.trim();if(v){name=v;localStorage.lbName=v;$('nm').textContent=v}$('nin').style.display='none'}};lb.info().then(i=>{name=localStorage.lbName||cap(i.user);$('nm').textContent=name+' 👋';$('ver').textContent='Version '+i.version;setTimeout(showUi,3600)})})();</script></body></html>

<!DOCTYPE html><html lang='de'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Kaminkehrer Lernbubbles</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{color:#fff;font-family:Segoe UI,-apple-system,sans-serif;background:radial-gradient(circle at 12% 15%,#ff6a00 0,transparent 34%),radial-gradient(circle at 90% 10%,#00d4ff 0,transparent 38%),radial-gradient(circle at 75% 95%,#9b5cff 0,transparent 40%),#080d1c}.glass{background:rgba(255,255,255,.12);backdrop-filter:blur(22px) saturate(180%);-webkit-backdrop-filter:blur(22px) saturate(180%);border:1px solid rgba(255,255,255,.3);box-shadow:0 10px 30px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.55)}#top{position:fixed;z-index:5;top:10px;left:10px;right:10px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:8px 12px;border-radius:22px}h1{font-size:1rem;margin:0 auto 0 0}input{background:rgba(0,0,0,.3);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:99px;padding:8px 14px;font:inherit;outline:none;min-width:190px}button{cursor:pointer;color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:99px;padding:6px 12px;font:inherit;font-weight:600;font-size:.85rem;background:linear-gradient(180deg,rgba(255,255,255,.3),rgba(255,255,255,.06));transition:.15s}button:hover{transform:translateY(-2px)}button:disabled{cursor:default;transform:none}#bar{display:flex;width:140px;height:10px;border-radius:99px;background:rgba(0,0,0,.35);overflow:hidden}#bar i{display:block;height:100%;transition:.4s}#bg{background:#34d399}#br{background:#f87171}#stage{position:absolute;inset:0;cursor:grab;touch-action:none}#world{position:absolute;left:0;top:0;transform-origin:0 0}svg{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible}path{fill:none;stroke:rgba(255,255,255,.35);stroke-width:2}.b{position:absolute;transform:translate(-50%,-50%);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;padding:8px;line-height:1.1;font-weight:600;border:1px solid rgba(255,255,255,.45);animation:pop .35s cubic-bezier(.3,1.6,.5,1);transition:transform .2s,box-shadow .2s,opacity .2s;background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.5),hsla(var(--h),90%,60%,.35) 55%,hsla(var(--h),90%,45%,.25));box-shadow:0 6px 22px rgba(0,0,0,.35),inset 0 2px 4px rgba(255,255,255,.6)}.b:hover{transform:translate(-50%,-50%) scale(1.18);z-index:9;box-shadow:0 0 34px hsla(var(--h),95%,65%,.9),inset 0 2px 4px rgba(255,255,255,.7)}.b i{font-style:normal;font-size:1.5em}.b span{font-size:.72em}.b.r{width:130px;height:130px;font-size:1rem}.b.c{width:112px;height:112px;font-size:.9rem}.b.s{width:96px;height:96px;font-size:.82rem}.b.l{width:88px;height:88px;font-size:.78rem}.b.done{border:3px solid #34d399}.b.bad{border:3px solid #f87171}.b.dim{opacity:.15}.b.m{box-shadow:0 0 30px 6px #fde047}@keyframes pop{from{transform:translate(-50%,-50%) scale(.2);opacity:0}}#panel{position:fixed;z-index:6;right:12px;bottom:12px;top:80px;width:min(400px,calc(100% - 24px));border-radius:24px;padding:18px;overflow:auto;transform:translateX(120%);transition:.3s}#panel.on{transform:none}#panel h2{margin:0 0 8px}#panel ul{padding-left:20px;line-height:1.7}.bd{display:inline-block;font-size:.72rem;padding:2px 10px;border-radius:99px;margin-bottom:8px}.g{background:rgba(52,211,153,.45)}.y{background:rgba(250,204,21,.45)}.o{display:block;width:100%;margin:6px 0;text-align:left}.o.ok{background:rgba(52,211,153,.6)}.o.no{background:rgba(248,113,113,.6)}#fb{margin-top:8px;font-weight:700}.nt{font-size:.72rem;opacity:.65}.pb{height:10px;border-radius:99px;background:rgba(0,0,0,.35);overflow:hidden;margin:8px 0}.pb i{display:block;height:100%;background:linear-gradient(90deg,#34d399,#7dd3fc)}.zg{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin:8px 0}.zc{background:rgba(0,0,0,.3);border-radius:14px;padding:8px;text-align:center}.zc b{display:block;font-size:1rem;color:#a7f3d0}.zc small{font-size:.68rem;opacity:.85}#ov{position:fixed;inset:70px 12px 12px 12px;z-index:8;border-radius:24px;padding:18px;overflow:auto;display:none}#ov.on{display:block}table{width:100%;border-collapse:collapse;margin:6px 0 14px;font-size:.88rem}caption{text-align:left;font-weight:700;padding:4px 0}td{padding:5px 8px;border-bottom:1px solid rgba(255,255,255,.15)}.zv{font-weight:700;color:#a7f3d0}.cd{text-align:center;padding:24px;margin:12px 0;background:rgba(0,0,0,.25);border-radius:20px}.big{font-size:1.7rem}#goal{font-weight:700}</style></head><body><div id='top' class='glass'><h1>🔥 Lernbubbles</h1><input id='q' placeholder='Suchen: 40 cm, Pellets, 85 °C' oninput='render()'><button onclick='startEx()'>📝 Prüfung</button><button onclick='cards()'>🃏 Karten</button><button onclick='cheat()'>📋 Spickzettel</button><button onclick='rnd()'>🎲</button><button onclick='closeAll()'>Alles zu</button><button onclick='logv()'>📜 Log</button><button onclick='exp()' title='Fortschritt sichern'>⬇</button><button onclick='imp()' title='Fortschritt laden'>⬆</button><button onclick='rst()'>↺</button><span id='goal'></span><div id='bar'><i id='bg'></i><i id='br'></i></div><span id='pg'></span></div><div id='stage'><div id='world'></div></div><aside id='panel' class='glass'></aside><section id='ov' class='glass'></section><script src='data.js'></script><script>const $=id=>document.getElementById(id);let uid=0,mt=null,moved=0,drag=null,ex=null,fc=null;const leaves=[],B={},open=new Set([0]),res=JSON.parse(localStorage.lb2||'{}'),day=JSON.parse(localStorage.lb2d||'{}'),td=new Date().toISOString().slice(0,10),view={x:innerWidth/2,y:innerHeight/2+30,s:Math.min(1,innerWidth/900)};if(day.d!==td){day.d=td;day.n=0}(function prep(n,par,h,d){n.id=uid++;n.par=par;n.d=d;n.h=h;B[n.id]=n;(n.c||[]).forEach((c,i)=>prep(c,n,d===0?i*40+15:h,d+1));if(n.leaf)leaves.push(n)})(ROOT,null,30,0);const txt=n=>(n.n+' '+n.b.join(' ')+' '+n.z.map(r=>r.join(' ')).join(' ')).toLowerCase();const has=n=>n.leaf?mt.has(n.id):n.c.some(has);const top=n=>{while(n.par&&n.par.par)n=n.par;return n};function gl(){$('goal').textContent=(day.n>=10?'🔥 ':'🎯 ')+day.n+'/10'}function tick(){day.n++;localStorage.lb2d=JSON.stringify(day);gl()}function apply(){$('world').style.transform=`translate(${view.x}px,${view.y}px) scale(${view.s})`}function layout(n,x,y,a){n.x=x;n.y=y;if(!n.c||!open.has(n.id))return;const k=n.c.length;n.c.forEach((c,j)=>{if(n.d===0){const R=Math.max(340,k*36),t=-Math.PI/2+j*2*Math.PI/k;layout(c,x+Math.cos(t)*R,y+Math.sin(t)*R,t)}else{const sp=k>1?Math.min(4.7,.62*(k-1)):0,t=a+(k>1?(j/(k-1)-.5)*sp:0),r=175+Math.max(0,k-4)*18;layout(c,x+Math.cos(t)*r,y+Math.sin(t)*r,t)}})}function el(n){const d=document.createElement('div');d.className='b '+(n.d===0?'r':n.leaf?'l':n.d===1?'c':'s')+(res[n.id]===1?' done':res[n.id]===0?' bad':'');d.style.left=n.x+'px';d.style.top=n.y+'px';d.style.setProperty('--h',n.h);d.innerHTML=`<i>${n.i}</i><span>${n.n}</span>`;if(mt){if(!has(n))d.classList.add('dim');else if(n.leaf)d.classList.add('m')}d.onclick=()=>{if(moved<6)click(n)};$('world').appendChild(d)}function render(){layout(ROOT,0,0,0);const q=$('q').value.trim().toLowerCase();mt=null;if(q){mt=new Set(leaves.filter(l=>txt(l).includes(q)).map(l=>l.id));mt.forEach(id=>{for(let p=B[id].par;p;p=p.par)open.add(p.id)});layout(ROOT,0,0,0)}const w=$('world');w.innerHTML='';const sv=document.createElementNS('http://www.w3.org/2000/svg','svg');w.appendChild(sv);let ps='';const walk=n=>{el(n);if(open.has(n.id))(n.c||[]).forEach(c=>{ps+=`<path d='M${n.x} ${n.y}L${c.x} ${c.y}'/>`;walk(c)})};walk(ROOT);sv.innerHTML=ps;const v=Object.values(res),r=v.filter(x=>x===1).length,wr=v.length-r,t=leaves.length;$('bg').style.width=r/t*100+'%';$('br').style.width=wr/t*100+'%';$('pg').textContent=`✅ ${r} ❌ ${wr} · ${v.length?Math.round(r/v.length*100):0} % · ${v.length}/${t}`}function click(n){if(n.c){if(open.has(n.id))open.delete(n.id);else{open.add(n.id);if(n.par)n.par.c.forEach(s=>{if(s!==n)open.delete(s.id)})}}render();show(n)}function quiz(n,fn){return n.q[1].map((t,i)=>[t,i]).sort(()=>Math.random()-.5).map(([t,i])=>`<button class='o' data-i='${i}' onclick='${fn}(${n.id},${i},this)'>${t}</button>`).join('')}function lock(n){document.querySelectorAll('#panel .o').forEach(b=>{b.disabled=true;if(+b.dataset.i===n.q[2])b.classList.add('ok')})}function rec(id,r){if(r)res[id]=1;else if(res[id]!==1)res[id]=0;localStorage.lb2=JSON.stringify(res);tick()}function show(n){let h=`<button onclick='cl()' style='float:right'>✕</button><h2>${n.i} ${n.n}</h2>`;if(n.leaf){h+=`<div class='bd ${n.k?'g':'y'}'>${n.k?'✓ Wortlaut/Quelle gelesen':'⚠ bitte im Original prüfen'}</div>${n.z.length?`<div class='zg'>${n.z.map(r=>`<div class='zc'><b>${r[1]}</b><small>${r[0]}</small></div>`).join('')}</div>`:''}<ul>${n.b.map(x=>`<li>${x}</li>`).join('')}</ul><h3>🧠 ${n.q[0]}</h3>`+quiz(n,'ans')+`<div id='fb'></div>`}else h+=`<p>${n.c.length} Unterthemen:</p><ul>${n.c.map(c=>`<li>${c.i} ${c.n}</li>`).join('')}</ul>`;h+=`<p class='nt'>Lernhilfe, keine Rechtsberatung. Immer aktuelle Fassung prüfen.</p>`;$('panel').innerHTML=h;$('panel').classList.add('on')}function cl(){$('panel').classList.remove('on')}function ans(id,i,btn){const n=B[id],r=i===n.q[2];lock(n);btn.classList.add(r?'ok':'no');$('fb').textContent=r?'✅ Richtig!':'❌ Falsch. Richtig: '+n.q[1][n.q[2]];rec(id,r);render()}function startEx(ids){const pool=ids||leaves.map(l=>l.id).sort(()=>Math.random()-.5).slice(0,15);ex={q:pool,i:0,r:0,w:0,bad:[]};exq()}function exq(){const n=B[ex.q[ex.i]],N=ex.q.length;$('panel').innerHTML=`<button onclick='cl()' style='float:right'>✕</button><h2>📝 Prüfung</h2><div class='pb'><i style='width:${ex.i/N*100}%'></i></div><p>Frage ${ex.i+1}/${N} · ✅ ${ex.r} ❌ ${ex.w}</p><h3>${n.i} ${n.q[0]}</h3>${quiz(n,'exa')}<div id='fb'></div>`;$('panel').classList.add('on')}function exa(id,i,btn){const n=B[id],r=i===n.q[2];lock(n);btn.classList.add(r?'ok':'no');rec(id,r);if(r)ex.r++;else{ex.w++;ex.bad.push(id)}$('fb').innerHTML=(r?'✅ Richtig':'❌ Falsch. Richtig: '+n.q[1][n.q[2]])+`<br><button onclick='exn()'>${ex.i+1<ex.q.length?'Weiter ▶':'Ergebnis'}</button>`;render()}function exn(){ex.i++;if(ex.i<ex.q.length)return exq();const N=ex.q.length,p=Math.round(ex.r/N*100),ok=p>=80;$('panel').innerHTML=`<button onclick='cl()' style='float:right'>✕</button><h2>${ok?'🎉 Bestanden':'😬 Nicht bestanden'}</h2><div class='pb'><i style='width:${p}%'></i></div><p><b>${ex.r}/${N}</b> richtig (${p} %). Bestehen ab 80 %.</p>${ex.bad.length?`<h3>Fehler</h3><ul>${ex.bad.map(id=>`<li>${B[id].n}: ${B[id].q[1][B[id].q[2]]}</li>`).join('')}</ul><button onclick='startEx(ex.bad.slice())'>🔁 Fehler wiederholen</button>`:''}`}function ov(h){$('ov').innerHTML=`<button onclick='cv()' style='float:right'>✕</button>`+h;$('ov').classList.add('on')}function cv(){$('ov').classList.remove('on')}function cheat(){ov(`<h2>📋 Spickzettel</h2><input id='cq' placeholder='Filter: Pellets, 85, Abstand ...' oninput='cf()'><div id='ct'></div>`);cf()}function cf(){const q=($('cq').value||'').toLowerCase();let h='',last='';leaves.forEach(l=>{if(!l.z.length)return;const t=top(l).n,rows=l.z.filter(r=>(l.n+' '+r.join(' ')+' '+t).toLowerCase().includes(q));if(!rows.length)return;if(t!==last){h+=`<h3>${t}</h3>`;last=t}h+=`<table><caption>${l.i} ${l.n}${l.k?'':' ⚠'}</caption>${rows.map(r=>`<tr><td>${r[0]}</td><td class='zv'>${r[1]}</td></tr>`).join('')}</table>`});$('ct').innerHTML=h||'Nichts gefunden.'}function cards(){const p=[];leaves.forEach(l=>l.z.forEach(r=>p.push([l,r])));fc={p:p.sort(()=>Math.random()-.5),i:0,r:0,w:0};card()}function card(){const [l,r]=fc.p[fc.i%fc.p.length];ov(`<h2>🃏 Zahlen-Blitz</h2><p>✅ ${fc.r} ❌ ${fc.w} · Karte ${fc.i+1}</p><div class='cd'><small>${top(l).n} › ${l.i} ${l.n}</small><h3>${r[0]}</h3><div id='cv' class='zv big' style='visibility:hidden'>${r[1]}</div></div><button onclick='rv()'>Aufdecken</button> <span id='cb' style='display:none'><button onclick='cr(1)'>✅ Gewusst</button> <button onclick='cr(0)'>❌ Nochmal</button></span>`)}function rv(){$('cv').style.visibility='visible';$('cb').style.display='inline'}function cr(ok){ok?fc.r++:fc.w++;tick();fc.i++;card()}function logv(){ov(`<h2>📜 Update-Log</h2>`+LOG.map(e=>`<h3>Version ${e.v} · ${e.d}</h3><ul>${e.c.map(x=>`<li>${x}</li>`).join('')}</ul>`).join(''))}function rst(){if(confirm('Fortschritt löschen?')){for(const k in res)delete res[k];localStorage.lb2='{}';render();cl()}}function exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(res)],{type:'application/json'}));a.download='lernbubbles-fortschritt.json';a.click()}function imp(){const i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=()=>i.files[0].text().then(t=>{Object.assign(res,JSON.parse(t));localStorage.lb2=JSON.stringify(res);render()});i.click()}function rnd(){const p=leaves.filter(l=>res[l.id]!==1),l=(p.length?p:leaves)[Math.floor(Math.random()*(p.length?p.length:leaves.length))];$('q').value='';open.clear();open.add(0);for(let a=l.par;a;a=a.par)open.add(a.id);render();view.x=innerWidth/2-l.x*view.s;view.y=innerHeight/2-l.y*view.s;apply();show(l)}function closeAll(){$('q').value='';open.clear();open.add(0);view.x=innerWidth/2;view.y=innerHeight/2+30;apply();render();cl();cv()}const st=$('stage');st.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY,vx:view.x,vy:view.y};moved=0};window.onpointermove=e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;moved=Math.max(moved,Math.abs(dx)+Math.abs(dy));view.x=drag.vx+dx;view.y=drag.vy+dy;apply()};window.onpointerup=()=>{drag=null};st.onwheel=e=>{e.preventDefault();const s=Math.min(2,Math.max(.4,view.s*(e.deltaY<0?1.1:.9)));view.x=e.clientX-(e.clientX-view.x)*s/view.s;view.y=e.clientY-(e.clientY-view.y)*s/view.s;view.s=s;apply()};document.onkeydown=e=>{if(e.key==='Escape'){cl();cv()}};gl();apply();render();</script></body></html>
